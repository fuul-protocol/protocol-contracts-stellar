[package]
name = "fuul-manager"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[package.metadata.stellar]
cargo_inherit = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
fuul-core = { workspace = true, features = ["access-control"] }
soroban-sdk = { workspace = true }
stellar-access = { workspace = true }
stellar-contract-utils = { workspace = true }

[dev-dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
fuul-factory = { path = "../fuul-factory" }
fuul-project = { path = "../fuul-project" }
soroban-sdk = { workspace = true, features = ["testutils"] }
stellar-tokens = { workspace = true }
